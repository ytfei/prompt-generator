<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提示词工坊 · 静态原型</title>
<style>
  :root {
    --accent: #6366f1;
    --accent-soft: #eef0ff;
    --text: #1f2330;
    --text-2: #6b7186;
    --border: #e4e7f0;
    --bg: #f5f6fa;
    --card: #ffffff;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
  }
  header {
    padding: 26px 32px 18px; max-width: 1280px; margin: 0 auto;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 22px; letter-spacing: .5px; }
  header h1 em { font-style: normal; color: var(--accent); }
  header .tag { font-size: 12px; color: var(--text-2); background: #eceef5; padding: 3px 10px; border-radius: 999px; }
  header .sub { width: 100%; color: var(--text-2); font-size: 13px; }

  .layout {
    max-width: 1280px; margin: 0 auto; padding: 0 32px 48px;
    display: grid; grid-template-columns: 1fr 400px; gap: 20px; align-items: start;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  /* 预设 */
  .presets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .presets .label { font-size: 13px; color: var(--text-2); }
  .preset-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; transition: .15s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 选项区 */
  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .groups { grid-template-columns: 1fr; } }
  .group { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .group h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .group h3 .state { font-weight: 400; font-size: 12px; color: var(--text-2); }
  .group h3 .state.on { color: var(--accent); }
  .group .hint { font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: #fafbfe; color: var(--text);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 12.5px; transition: .12s; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .neg-custom {
    margin-top: 10px; width: 100%; border: 1px dashed var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 12.5px; color: var(--text); outline: none;
  }
  .neg-custom:focus { border-color: var(--accent); }

  /* 右栏 */
  .panel { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .panel .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .panel h2 { font-size: 15px; margin-bottom: 10px; }
  textarea#theme {
    width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; font-family: inherit; color: var(--text); outline: none; line-height: 1.6;
  }
  textarea#theme:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  button.primary {
    flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 11px 0; font-size: 14.5px; font-weight: 600; cursor: pointer; transition: .15s;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost {
    background: none; border: 1px solid var(--border); color: var(--text-2);
    border-radius: 10px; padding: 11px 16px; cursor: pointer; font-size: 13px;
  }
  button.ghost:hover { color: var(--accent); border-color: var(--accent); }

  /* 生成过程 */
  .steps { list-style: none; font-size: 12.5px; color: var(--text-2); }
  .steps li { padding: 3px 0; opacity: .35; transition: .2s; }
  .steps li.active { opacity: 1; color: var(--accent); }
  .steps li.done { opacity: 1; color: var(--text); }
  .steps li .dot { display: inline-block; width: 14px; }
  .steps li.active .dot::before { content: "◍"; }
  .steps li.done .dot::before { content: "✓"; color: #22c07a; }

  /* 结果 */
  #resultWrap { display: none; }
  .result-text {
    background: #f8f9fd; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-all;
  }
  .notes { margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .notes .note-item { padding: 2px 0; }
  .notes .note-item::before { content: "· "; color: var(--accent); font-weight: 700; }
  .notes .note-warn { color: #d97706; }
  .copy-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .copy-btn {
    background: #22c07a; color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .copy-btn.ok { background: #16a364; }
  .ratio-badge { font-size: 12px; color: var(--text-2); }
  footer { text-align: center; color: var(--text-2); font-size: 12px; padding: 0 0 30px; }
</style>
</head>

<header>

      <button class="preset-btn" id="resetBtn" style="margin-left:auto">↺ 重置全部</button>
    </div>
    <div class="groups" id="groups"></div>
  </div>

  <!-- 右侧：主题 + 生成 -->

        <button class="primary" id="genBtn">✨ 生成提示词</button>

      <ul class="steps" id="steps" style="display:none;margin-top:12px">

        <li data-step="3"><span class="dot"></span> 输出最终提示词</li>
      </ul>
    </div>

    <div class="card" id="resultWrap">
      <h2>最终提示词</h2>
      <div class="result-text" id="resultText"></div>
      <div class="notes" id="notes"></div>
      <div class="copy-row">
        <button class="copy-btn" id="copyBtn">复制</button>
        <span class="ratio-badge" id="ratioBadge"></span>
      </div>
    </div>
  </div>
</div>

<footer>提示词工坊 v0.1 · 本原型为交互演示，生成逻辑为本地模拟，P1 将接入真实 LLM Agent</footer>

                    ${g.hint ? `<div class="hint">${g.hint}</div>` : ''}`;
  const chips = document.createElement('div');
  chips.className = 'chips';
  g.options.forEach(([label]) => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (cur && (DATA[gid].multi ? cur.includes(label) : cur === label) ? ' on' : '');
    chip.textContent = label;
    chip.onclick = () => {
      if (DATA[gid].multi) {
        const arr = getSel(gid);
        const i = arr.indexOf(label);
        i >= 0 ? arr.splice(i, 1) : arr.push(label);
        sel[gid] = arr;
        chip.classList.toggle('on');
      } else {
        if (getSel(gid) === label) { delete sel[gid]; chip.classList.remove('on'); }
        else {
          sel[gid] = label;
          chips.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
          chip.classList.add('on');
          if (gid === 'usage') autoRatio(label);   // 用途 → 推荐画幅
        }
      }
      updateState(gid); save();
    };
    chips.appendChild(chip);
  });
  card.appendChild(chips);
  if (gid === 'negative') {
    const input = document.createElement('input');
    input.className = 'neg-custom';
    input.placeholder = '自定义排除项，回车添加…';
    input.onkeydown = e => {
      if (e.key === 'Enter' && input.value.trim()) {
        const v = input.value.trim();
        if (!sel.negative.includes(v)) sel.negative.push(v);
        input.value = ''; save(); renderCustomNeg(v);
      }
    };
    card.appendChild(input);
    card._negInput = input;
  }
  groupsEl.appendChild(card);
});
// 恢复自定义排除项的 chip
(getSel('negative') || []).forEach(v => {
  if (!DATA.negative.options.some(o => o[0] === v)) renderCustomNeg(v);
});

function renderCustomNeg(v) {
  const chips = document.querySelector('#groups .group:last-child .chips');
  const chip = document.createElement('span');
  chip.className = 'chip on'; chip.textContent = v;
  chip.onclick = () => {
    sel.negative = sel.negative.filter(x => x !== v);
    chip.remove(); updateState('negative'); save();
  };
  chips.appendChild(chip);
}

function updateState(gid) {
  const el = document.getElementById('state-' + gid);
  const cur = getSel(gid);
  const txt = DATA[gid].multi ? (cur.length ? `已选 ${cur.length}` : '不限定') : (cur || '不限定');
  el.textContent = txt;
  el.classList.toggle('on', !!(DATA[gid].multi ? cur.length : cur));
}
Object.keys(DATA).forEach(updateState);

function autoRatio(usage) {
  const opt = DATA.usage.options.find(o => o[0] === usage);
  const r = opt && opt[2];
  if (!r) return;
  sel.ratio = r;
  // 更新 ratio 组的 chip 状态
  const groups = document.querySelectorAll('.group');
  const ratioCard = [...groups].find(c => c.querySelector('h3') && c.querySelector('h3').textContent.includes('画幅比例'));
  if (ratioCard) {
    ratioCard.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.textContent === r));
    updateState('ratio');
  }
}

/* ============ 预设与重置 ============ */
document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
  btn.onclick = () => {
    const p = PRESETS[btn.dataset.preset];
    sel = JSON.parse(JSON.stringify(p.sel));
    save(); location.reload();
    setTimeout(() => { try { localStorage.setItem('pg-last-preset', p.label); } catch(e){} }, 0);
  };
});
document.getElementById('resetBtn').onclick = () => { sel = {}; save(); location.reload(); };

/* ============ 提示词组装 + 模拟 Agent ============ */
const themeEl = document.getElementById('theme');
const genBtn = document.getElementById('genBtn');
const stepsEl = document.getElementById('steps');
const resultWrap = document.getElementById('resultWrap');
const resultText = document.getElementById('resultText');
const notesEl = document.getElementById('notes');
const copyBtn = document.getElementById('copyBtn');
const ratioBadge = document.getElementById('ratioBadge');

const phrase = gid => {
  const cur = getSel(gid);
  if (!cur) return '';
  const opt = DATA[gid].options.find(o => o[0] === cur);
  return opt ? opt[1] : '';
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

function build() {
  const notes = [], warns = [];
  const theme = themeEl.value.trim();

  // ── 冲突检查与修正 ──
  let tone = phrase('tone'), toneLabel = getSel('tone');
  const mood = getSel('mood');
  if (mood && ['忧郁孤独','宁静平和'].includes(mood) && toneLabel && ['高饱和','霓虹撞色'].includes(toneLabel)) {
    tone = '低饱和柔和色彩，克制而统一';
    notes.push(`检测到「${mood}」与「${toneLabel}」存在情绪冲突，已调整为低饱和柔和表述`);
  }
  const usage = getSel('usage'), ratio = getSel('ratio');
  const usageRatio = usage ? (DATA.usage.options.find(o => o[0] === usage) || [])[2] : '';
  if (usage && ratio && usageRatio && ratio !== usageRatio) {
    warns.push(`所选画幅 ${ratio} 与用途「${usage}」推荐画幅 ${usageRatio} 不一致，建议在即梦中以 ${usageRatio} 出图`);
  }

  // ── 组装 ──
  const parts = [];
  const style = phrase('style'), genre = phrase('genre');
  if (style) parts.push(style);
  if (genre) parts.push(genre);
  if (theme) {
    parts.push(`画面主体：${theme}`);
  } else {
    parts.push('一幅氛围感画面，主体自然融入环境');
    warns.push('主题描述为空：已生成氛围型提示词，补充主题可获得更精准的结果');
  }
  const bg = phrase('bg');    if (bg) parts.push(`背景为${bg}`);
  const light = phrase('light'); if (light) parts.push(light);
  if (tone) parts.push(tone);
  const comp = phrase('comp');  if (comp) parts.push(comp);
  const shot = phrase('shot');  if (shot) parts.push(shot);
  const moodP = phrase('mood'); if (moodP) parts.push(`整体${moodP}`);
  const tex = phrase('texture'); if (tex) parts.push(`呈现${tex}`);
  const txt = phrase('text');   if (txt) parts.push(txt);

  const creative = getSel('creative');
  if (creative === '严格遵循') parts.push('严格依据上述描述呈现，不做额外发挥');
  else if (creative === '充分发挥') parts.push('在保持主题的前提下，大胆补充富有想象力的细节');

  parts.push('超高细节，画质精致');
  if (ratio) parts.push(`画幅比例 ${ratio}`);
  else if (usageRatio) parts.push(`画幅比例 ${usageRatio}`);

  let prompt = parts.filter(Boolean).join('，') + '。';
  const negs = getSel('negative');
  if (negs && negs.length) {
    const negPhrases = negs.map(v => {
      const o = DATA.negative.options.find(x => x[0] === v);
      return o ? o[1] : `不出现${v}`;
    });
    prompt += ' 避免出现：' + negPhrases.join('，') + '。';
  }

  if (creative === '充分发挥' && theme) notes.push('已按「充分发挥」自由度，在主题基础上预留了创意补全空间（真实 Agent 将自动扩写细节）');
  if (usage && ratio && ratio === usageRatio) notes.push(`画幅 ${ratio} 已与用途「${usage}」对齐`);

  return { prompt, notes, warns, ratio: ratio || usageRatio || '' };
}

let generating = false;
genBtn.onclick = async () => {
  if (generating) return;
  generating = true; genBtn.disabled = true;
  resultWrap.style.display = 'none';
  stepsEl.style.display = 'block';
  const items = stepsEl.querySelectorAll('li');
  items.forEach(li => li.className = '');

  for (let i = 0; i < items.length; i++) {
    items[i].className = 'active';
    await sleep(i === 2 ? 650 : 480);   // 冲突检查一步稍长，体现"迭代修复"
    items[i].className = 'done';
  }

  const { prompt, notes, warns, ratio } = build();
  resultText.textContent = prompt;
  ratioBadge.textContent = ratio ? `建议画幅：${ratio}` : '';
  notesEl.innerHTML =
    warns.map(w => `<div class="note-item note-warn">⚠ ${w}</div>`).join('') +
    notes.map(n => `<div class="note-item">${n}</div>`).join('');
  resultWrap.style.display = 'block';
  stepsEl.style.display = 'none';
  genBtn.disabled = false; generating = false;
  resultWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

copyBtn.onclick = async () => {
  try {
    await navigator.clipboard.writeText(resultText.textContent);
    copyBtn.textContent = '✓ 已复制'; copyBtn.classList.add('ok');
    setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('ok'); }, 1600);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = resultText.textContent; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    copyBtn.textContent = '✓ 已复制';
    setTimeout(() => { copyBtn.textContent = '复制'; }, 1600);
  }
};
</script>
</body>
</html>
